<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GABECA | Elevate Your Experience</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --gabeca-main: #0d6efd;
            --gabeca-accent: #6610f2;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .navbar-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .text-gradient {
            background: linear-gradient(45deg, var(--gabeca-main), var(--gabeca-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-img-container {
            height: 300px;
            overflow: hidden;
            border-radius: 20px;
            background-color: #f8f9fa;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-aesthetic {
            border: none;
            background: transparent;
            transition: transform 0.3s ease;
        }

        .card-aesthetic:hover .card-img-container img {
            transform: scale(1.08);
        }

        .card-aesthetic:hover {
            transform: translateY(-5px);
        }

        .btn-round {
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
        }

        .nav-link {
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 5px;
            left: 50%;
            background-color: var(--gabeca-main);
            transition: all 0.3s ease;
        }

        .nav-link:hover::after {
            width: 70%;
            left: 15%;
        }

        .spacer { height: 100px; }
        
        .badge-gabeca {
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
        }
    </style>
</head>
